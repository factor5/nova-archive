<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nova Archive — Sci-Fi Award Library</title>
<meta name="app-version" content="22">
<meta name="theme-color" content="#04060d">
<script>try{var C={dark:"#04060d",paper:"#f3eee1",terminal:"#000000",dune:"#1b120b"},t=localStorage.getItem("nova-theme");if(!C[t])t="auto";var r=t==="auto"?(matchMedia("(prefers-color-scheme: light)").matches?"paper":"dark"):t;document.documentElement.dataset.theme=r;document.querySelector('meta[name=theme-color]').content=C[r]}catch(e){}</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nova Archive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme-nova.css?v=22">
<link rel="stylesheet" href="css/theme-paper.css?v=22">
<link rel="stylesheet" href="css/theme-terminal.css?v=22">
<link rel="stylesheet" href="css/theme-dune.css?v=22">
<link rel="stylesheet" href="css/base.css?v=22">
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div><h1>Nova Archive</h1><p class="tag">Science-fiction novel awards · winners &amp; finalists</p></div>
    </div>
    <div class="hud">
      <span class="chip"><span>Read</span><b id="hudRead">0</b><span>/ <span id="hudTotal">0</span></span><span class="bar"><i id="hudBar"></i></span></span>
      <button type="button" class="chip s-local" id="sync" title="Where your progress is stored" aria-live="polite"><svg class="orb" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(-24 12 12)" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3.6" fill="currentColor"/><circle class="sat" cx="21" cy="8" r="1.7" fill="currentColor"/></svg><span id="syncTxt">Loading…</span></button>
      <button type="button" class="chip" id="themeBtn"></button>
      <button class="btn sm" id="authBtn" hidden></button>
    </div>
  </header>
  <section id="nowReading" class="now" aria-label="Currently reading" hidden></section>
  <nav class="tabs" aria-label="Sections">
    <a href="#library" data-tab="library">Library</a>
    <a href="#lists" data-tab="lists">My Lists <span id="listCount"></span></a>
    <a href="#about" data-tab="about">About the data</a>
  </nav>
  <main id="app" aria-live="polite"></main>
</div>
<div id="ovRoot"></div>
<button type="button" id="toTop" aria-label="Back to top" title="Back to top" hidden>↑</button>
<div id="toastRoot" role="status"></div>

<script src="firebase-config.js?v=22"></script>
<script type="module" src="js/main.js?v=22"></script>
</body>
</html>
