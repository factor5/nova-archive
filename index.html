<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nova Archive — Sci-Fi Award Library</title>
<meta name="theme-color" content="#04060d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nova Archive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04060d; --bg2:#0a1024; --panel:rgba(11,18,40,.78); --panel2:rgba(18,28,60,.85);
  --line:rgba(70,190,255,.22); --line2:rgba(70,190,255,.5);
  --cyan:#3be8ff; --mag:#ff4bd8; --amber:#ffc53d; --green:#5dffb0;
  --text:#dce8ff; --muted:#93a8d0; --danger:#ff6b81;
  --display:'Orbitron','Exo 2',system-ui,sans-serif; --body:'Exo 2',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100vh;
  background-image:
    radial-gradient(1200px 600px at 85% -10%,rgba(255,75,216,.14),transparent 60%),
    radial-gradient(1000px 700px at -10% 10%,rgba(59,232,255,.13),transparent 60%),
    linear-gradient(rgba(70,190,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(70,190,255,.045) 1px,transparent 1px);
  background-size:auto,auto,44px 44px,44px 44px;background-attachment:fixed}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.7;
  background-image:
   radial-gradient(1.2px 1.2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 33% 72%,#bfe9ff,transparent),
   radial-gradient(1.4px 1.4px at 58% 28%,#fff,transparent),radial-gradient(1px 1px at 76% 64%,#ffd3f6,transparent),
   radial-gradient(1.2px 1.2px at 90% 12%,#fff,transparent),radial-gradient(1px 1px at 22% 90%,#fff,transparent),
   radial-gradient(1px 1px at 66% 88%,#bfe9ff,transparent),radial-gradient(1.3px 1.3px at 44% 8%,#fff,transparent);
  animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.35}to{opacity:.85}}
@media (prefers-reduced-motion:reduce){.stars{animation:none}*{scroll-behavior:auto!important;transition:none!important}}
.wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:env(safe-area-inset-top) max(18px,env(safe-area-inset-right)) max(80px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
header.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;padding:22px 0 10px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:46px;height:46px;border:2px solid var(--cyan);border-radius:50%;position:relative;box-shadow:0 0 18px rgba(59,232,255,.5),inset 0 0 14px rgba(59,232,255,.35)}
.logo:before{content:"";position:absolute;left:-10px;right:-10px;top:50%;height:2px;background:linear-gradient(90deg,transparent,var(--mag),transparent);transform:rotate(-24deg);box-shadow:0 0 8px var(--mag)}
.logo:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--cyan);right:7px;top:7px;box-shadow:0 0 10px var(--cyan)}
h1{margin:0;font-family:var(--display);font-weight:900;letter-spacing:.14em;font-size:clamp(20px,3.2vw,30px);text-transform:uppercase;
  background:linear-gradient(90deg,var(--cyan),#9a7bff 55%,var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin:2px 0 0;color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:999px;font-size:13px;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.chip b{color:var(--text);font-family:var(--display);font-weight:700;letter-spacing:.04em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.s-synced .dot{background:var(--green);box-shadow:0 0 8px var(--green)}
.s-saving .dot{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.s-local .dot,.s-error .dot{background:var(--danger);box-shadow:0 0 8px var(--danger)}
.bar{height:6px;width:120px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--mag));width:0;transition:width .4s}
nav.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:8px 0 18px;flex-wrap:wrap}
nav.tabs a{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:11px 18px;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0}
nav.tabs a:hover{color:var(--text)}
nav.tabs a.on{color:var(--cyan);background:var(--panel);border-color:var(--line);box-shadow:0 -2px 14px rgba(59,232,255,.18) inset}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px);position:relative}
.filters{padding:16px;display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
label.f{display:grid;gap:5px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input[type=text],select{background:#070c1c;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;font-size:15px;min-width:140px}
input[type=text]{min-width:min(100%,260px)}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn{font:inherit;font-weight:600;font-size:14px;cursor:pointer;color:var(--text);background:rgba(59,232,255,.08);border:1px solid var(--line2);padding:8px 14px;border-radius:8px;transition:.15s;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:rgba(59,232,255,.2);box-shadow:0 0 14px rgba(59,232,255,.3)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.on{background:linear-gradient(135deg,rgba(93,255,176,.28),rgba(59,232,255,.2));border-color:var(--green);color:#eafff5}
.btn.warn{border-color:rgba(255,107,129,.6);background:rgba(255,107,129,.1)}
.btn.warn:hover{background:rgba(255,107,129,.25);box-shadow:0 0 14px rgba(255,107,129,.3)}
.btn.ghost{background:transparent}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:transparent;border:1px solid var(--line);padding:6px 12px;border-radius:999px;display:inline-flex;gap:7px;align-items:center}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.pill.on{color:var(--text);border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.pill:hover{color:var(--text)}
.summary{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:18px 2px 10px;color:var(--muted)}
.summary b{color:var(--text);font-family:var(--display)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;position:relative;transition:.18s;overflow:hidden}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line2)}
.card.win:before{background:linear-gradient(var(--amber),var(--mag));box-shadow:0 0 12px var(--amber)}
.card:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.45),0 0 18px rgba(59,232,255,.12)}
.card.is-read{opacity:.72}
.card.is-read h3:after{content:" ✓";color:var(--green)}
.card.flash{animation:flash 1.6s}
@keyframes flash{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 2px var(--amber),0 0 32px rgba(255,197,61,.6)}}
.card h3{margin:0;font-size:17px;font-weight:700;line-height:1.25}
.author{all:unset;cursor:pointer;color:var(--cyan);font-size:14px;width:fit-content}
.author:hover{text-decoration:underline}
.author:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.badges{display:flex;flex-wrap:wrap;gap:5px}
.b{font-size:11.5px;font-weight:600;letter-spacing:.03em;padding:3px 8px;border-radius:5px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);color:color-mix(in srgb,var(--c) 70%,#fff);background:color-mix(in srgb,var(--c) 10%,transparent);white-space:nowrap}
.b.w{background:color-mix(in srgb,var(--c) 30%,#0b1226);color:#fff;border-color:var(--c);box-shadow:0 0 8px color-mix(in srgb,var(--c) 40%,transparent)}
.b.dim{opacity:.55}
.links{display:grid;gap:3px;font-size:12.5px}
.lr{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center}
.lkh{color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;width:52px}
.lk{color:var(--cyan);text-decoration:none;border-bottom:1px dotted rgba(59,232,255,.5)}
.lk:hover{color:#fff;border-bottom-style:solid}
.lk:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.acts{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.group{margin:26px 0 12px;display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:6px}
.group h2{margin:0;font-family:var(--display);font-size:22px;letter-spacing:.1em;color:var(--cyan);text-shadow:0 0 14px rgba(59,232,255,.5)}
.group span{color:var(--muted);font-size:13px}
.more{display:flex;justify-content:center;margin:26px 0}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--display);letter-spacing:.1em;color:var(--text)}
.lists{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.lists{grid-template-columns:minmax(0,1fr)}}
.lside{padding:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.litem{all:unset;cursor:pointer;box-sizing:border-box;width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;display:flex;justify-content:space-between;gap:10px;color:var(--text)}
.litem:hover{border-color:var(--line2)}
.litem.on{border-color:var(--cyan);background:rgba(59,232,255,.12)}
.litem:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.litem small{color:var(--muted)}
.lmain{padding:18px;min-width:0}
.lhead{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:12px}
.lhead input{font-family:var(--display);font-size:20px;letter-spacing:.06em;min-width:min(100%,320px)}
.items{display:grid;gap:8px;margin-top:12px}
.item{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(7,12,28,.6)}
.item .n{font-family:var(--display);color:var(--muted);font-size:14px;text-align:center}
.item.is-read .t{color:var(--muted);text-decoration:line-through}
.item .t{font-weight:700}
.item .a{font-size:13px;color:var(--cyan)}
.ib{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.item>div:nth-child(2){min-width:0}
@media (max-width:1100px){.item{grid-template-columns:34px minmax(0,1fr)}.ib{grid-column:2;justify-content:flex-start}}
.ov{position:fixed;inset:0;z-index:50;background:rgba(2,4,10,.78);display:grid;place-items:center;padding:16px;backdrop-filter:blur(4px)}
.modal{width:min(480px,100%);max-height:86vh;overflow:auto;padding:20px;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;box-shadow:0 0 40px rgba(59,232,255,.25)}
.modal h3{margin:0 0 4px;font-family:var(--display);letter-spacing:.08em;color:var(--cyan);font-size:17px}
.modal p{margin:0 0 12px;color:var(--muted);font-size:14px}
.mrow{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;width:100%;background:transparent;color:var(--text);font:inherit;text-align:left}
.mrow:hover{border-color:var(--line2)}
.mrow .ck{width:20px;height:20px;border:1.5px solid var(--line2);border-radius:5px;display:grid;place-items:center;font-size:13px;color:var(--bg);flex:none}
.mrow.on .ck{background:var(--green);border-color:var(--green)}
.newl{display:flex;gap:8px;margin-top:12px;min-width:0}
.newl input{flex:1 1 0;width:0;min-width:0}
.newl .btn{flex:none}
.about{padding:22px;max-width:860px}
.about h2{font-family:var(--display);letter-spacing:.1em;color:var(--cyan);font-size:18px;margin:22px 0 8px}
.about h2:first-child{margin-top:0}
.about li{margin:6px 0;color:#c4d4f3}
.about a{color:var(--cyan)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;background:var(--bg2);border:1px solid var(--cyan);color:var(--text);padding:10px 18px;border-radius:999px;box-shadow:0 0 24px rgba(59,232,255,.35);font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div><h1>Nova Archive</h1><p class="tag">Science-fiction novel awards · winners &amp; finalists</p></div>
    </div>
    <div class="hud">
      <span class="chip"><span>Read</span><b id="hudRead">0</b><span>/ <span id="hudTotal">0</span></span><span class="bar"><i id="hudBar"></i></span></span>
      <span class="chip s-local" id="sync" title="Where your progress is stored"><span class="dot"></span><span id="syncTxt">Loading…</span></span>
      <button class="btn sm" id="authBtn" hidden>Sign in with Google</button>
    </div>
  </header>
  <nav class="tabs" aria-label="Sections">
    <a href="#library" data-tab="library">Library</a>
    <a href="#lists" data-tab="lists">My Lists <span id="listCount"></span></a>
    <a href="#about" data-tab="about">About the data</a>
  </nav>
  <main id="app" aria-live="polite"></main>
</div>
<div id="ovRoot"></div>
<div id="toastRoot" role="status"></div>

<script src="firebase-config.js"></script>
<script>
"use strict";
/* ---------- config ---------- */
const AWARDS=[
 {key:'Hugo Award',short:'Hugo',color:'#3be8ff'},
 {key:'Nebula Award',short:'Nebula',color:'#a98bff'},
 {key:'Arthur C. Clarke Award',short:'Clarke',color:'#5dffb0'},
 {key:'John W. Campbell Memorial Award',short:'Campbell',color:'#ff9f45'},
 {key:'Locus Award (SF Novel)',short:'Locus',color:'#ff4bd8'},
 {key:'Philip K. Dick Award',short:'PKD',color:'#ffd84a'},
 {key:'BSFA Award',short:'BSFA',color:'#6aa8ff'}
];
const AW=Object.fromEntries(AWARDS.map(a=>[a.key,a]));
const LS='nova-archive-v1';
const PAGE=60;

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(msg){const r=$('#toastRoot');r.innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',2200)}
function surname(a){const p=a.replace(/\s*&.*$/,'').replace(/ and .*$/,'').split(' ');return p[p.length-1].toLowerCase()}

/* ---------- state ---------- */
let BOOKS=[],BYID=new Map();
const S={read:new Set(),lists:[],updatedAt:0};
const ui={tab:'library',q:'',awards:new Set(),result:'all',read:'all',decade:'',sort:'best',group:'none',limit:PAGE,listId:null,author:''};
const serialize=()=>({v:1,read:[...S.read],lists:S.lists,updatedAt:S.updatedAt});
function loadFrom(o){S.read=new Set(Array.isArray(o.read)?o.read:[]);S.lists=Array.isArray(o.lists)?o.lists:[];S.updatedAt=o.updatedAt||0}
try{const raw=localStorage.getItem(LS);if(raw)loadFrom(JSON.parse(raw))}catch(e){}

/* ---------- persistence: Firebase (Google sign-in + Firestore), localStorage as local copy ---------- */
const FB_VER='11.10.0';
let ref=null,saving=false,dirty=false,timer=null,syncMode='loading',fb=null,unsub=null;
function setSync(mode){
  syncMode=mode;const el=$('#sync');el.className='chip s-'+((mode==='signin'||mode==='offline')?'local':mode);
  $('#syncTxt').textContent={synced:'Cloud synced',saving:'Saving…',local:'Saved in this browser only',signin:'Sign in to sync',error:'Sync problem – kept in this browser',denied:'Access denied for this account',loading:'Connecting…',offline:'Offline – will sync when connected'}[mode];
  if(mode==='denied')el.className='chip s-error';
}
function touch(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(serialize()))}catch(e){}
  if(!ref){setSync(fb?(fb.auth.currentUser?'offline':'signin'):'local');return}
  dirty=true;setSync('saving');clearTimeout(timer);timer=setTimeout(flush,700);
}
async function flush(){
  if(saving||!ref||!dirty)return;
  if(!navigator.onLine){setSync('offline');return}
  saving=true;dirty=false;
  try{await ref.set(serialize());if(!dirty)setSync('synced')}catch(e){setSync(e&&e.code==='permission-denied'?'denied':'error')}
  saving=false;
  if(dirty){clearTimeout(timer);timer=setTimeout(flush,300)}
}
function fbConfigured(){
  const c=window.NOVA_FIREBASE;
  return !!(c&&c.apiKey&&c.projectId&&!/^PASTE/i.test(c.apiKey)&&!/^PASTE/i.test(c.projectId));
}
function showAuth(u){
  const b=$('#authBtn');if(!fb){b.hidden=true;return}
  b.hidden=false;b.textContent=u?'Sign out':'Sign in with Google';
  b.title=u?('Signed in as '+(u.email||u.uid)):'Sign in to save your progress in the cloud';
}
async function connect(){
  if(!fbConfigured()){setSync('local');return}
  try{
    const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
    const [A,Au,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    const app=A.initializeApp(window.NOVA_FIREBASE);
    let db;
    try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}
    catch(e){db=F.getFirestore(app)}
    fb={Au,F,auth:Au.getAuth(app),db};
    showAuth(null);setSync('signin');
    Au.onAuthStateChanged(fb.auth,onUser);
  }catch(e){fb=null;showAuth(null);setSync('error')}
}
async function onUser(u){
  if(unsub){unsub();unsub=null}
  ref=null;showAuth(u);
  if(!u){setSync('signin');return}
  setSync('loading');
  try{
    const {F,db}=fb;const d=F.doc(db,'users',u.uid);
    const snap=await Promise.race([F.getDoc(d),new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),10000))]);
    ref={set:o=>F.setDoc(d,o)};
    if(snap.exists()){
      const x=snap.data();
      if((x.updatedAt||0)>=S.updatedAt){loadFrom(x);try{localStorage.setItem(LS,JSON.stringify(serialize()))}catch(e){}}
      else{dirty=true}
    }else if(S.read.size||S.lists.length){dirty=true}
    setSync('synced');renderAll();
    if(dirty){setSync('saving');flush()}
    unsub=F.onSnapshot(d,s=>{
      if(s.metadata.hasPendingWrites||saving||dirty||!s.exists())return;
      const x=s.data();
      if((x.updatedAt||0)>S.updatedAt){loadFrom(x);renderAll()}
    },()=>{});
  }catch(e){ref=null;setSync(e&&e.code==='permission-denied'?'denied':(!navigator.onLine||(e&&(e.code==='unavailable'||e.message==='timeout')))?'offline':'error')}
}
async function authClick(){
  if(!fb)return;
  try{
    if(fb.auth.currentUser){await fb.Au.signOut(fb.auth);return}
    const prov=new fb.Au.GoogleAuthProvider();
    try{await fb.Au.signInWithPopup(fb.auth,prov)}
    catch(e){if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'))await fb.Au.signInWithRedirect(fb.auth,prov);else if(!e||e.code!=='auth/popup-closed-by-user')toast('Sign-in failed'+(e&&e.code?' ('+e.code+')':''))}
  }catch(e){toast('Sign-in failed')}
}

/* ---------- data prep ---------- */
function prep(list){
  BOOKS=list;BYID=new Map();
  for(const b of BOOKS){
    BYID.set(b.id,b);
    b._n=norm(b.title+' '+b.author);
    b.wins=b.entries.filter(e=>e.result==='winner').length;
    b.noms=b.entries.length;
    b.first=Math.min(...b.entries.map(e=>e.year));
    b.last=Math.max(...b.entries.map(e=>e.year));
    b.entries.sort((x,y)=>(y.result==='winner')-(x.result==='winner')||x.year-y.year);
    b._s=surname(b.author);
  }
}

/* ---------- filtering ---------- */
function matchEntry(e){
  if(ui.awards.size&&!ui.awards.has(e.award))return false;
  if(ui.result==='winner'&&e.result!=='winner')return false;
  if(ui.decade){const d=+ui.decade;if(e.year<d||e.year>d+9)return false}
  return true;
}
function visible(){
  const q=norm(ui.q);const au=ui.author;
  return BOOKS.filter(b=>{
    if(au&&b.author!==au)return false;
    if(q&&!b._n.includes(q))return false;
    const r=S.read.has(b.id);
    if(ui.read==='read'&&!r)return false;
    if(ui.read==='unread'&&r)return false;
    return b.entries.some(matchEntry);
  });
}
function sortBooks(arr){
  const f={
    best:(a,b)=>(b.wins*3+b.noms)-(a.wins*3+a.noms)||b.last-a.last,
    newest:(a,b)=>b.last-a.last||a.title.localeCompare(b.title),
    oldest:(a,b)=>a.first-b.first||a.title.localeCompare(b.title),
    title:(a,b)=>a.title.localeCompare(b.title),
    author:(a,b)=>a._s.localeCompare(b._s)||a.title.localeCompare(b.title),
    wins:(a,b)=>b.wins-a.wins||b.noms-a.noms
  }[ui.sort];
  return arr.slice().sort(f);
}
function groups(arr){
  if(ui.group==='none')return [{label:'',books:sortBooks(arr)}];
  const m=new Map();
  const add=(k,b)=>{if(!m.has(k))m.set(k,[]);const a=m.get(k);if(!a.includes(b))a.push(b)};
  for(const b of arr){
    if(ui.group==='author'){add(b.author,b);continue}
    for(const e of b.entries){
      if(!matchEntry(e))continue;
      if(ui.group==='year')add(String(e.year),b);
      else if(ui.group==='decade')add(Math.floor(e.year/10)*10+'s',b);
      else if(ui.group==='award')add(e.award,b);
    }
  }
  let keys=[...m.keys()];
  if(ui.group==='year'||ui.group==='decade')keys.sort((a,b)=>parseInt(b)-parseInt(a));
  else if(ui.group==='award')keys.sort((a,b)=>AWARDS.findIndex(x=>x.key===a)-AWARDS.findIndex(x=>x.key===b));
  else keys.sort((a,b)=>surname(a).localeCompare(surname(b)));
  const rev=ui.sort==='oldest';
  return keys.map(k=>{
    let books=m.get(k);
    if(ui.group==='author')books=sortBooks(books);
    else books=books.slice().sort((a,b)=>{
      const wa=a.entries.some(e=>e.result==='winner'&&gk(e)===k),wb=b.entries.some(e=>e.result==='winner'&&gk(e)===k);
      return (wb-wa)||a.title.localeCompare(b.title)});
    return {label:ui.group==='award'?(AW[k]?AW[k].short+' — '+k:k):k,books};
  });
  function gk(e){return ui.group==='year'?String(e.year):ui.group==='decade'?Math.floor(e.year/10)*10+'s':e.award}
}

/* ---------- views ---------- */
function badge(e){
  const a=AW[e.award]||{short:e.award,color:'#999'};
  return `<span class="b ${e.result==='winner'?'w':'dim'}" style="--c:${a.color}" title="${esc(e.award)} ${e.year} — ${e.result}">${e.result==='winner'?'★ ':''}${esc(a.short)} ${e.year}</span>`;
}
function wiki(q){return 'https://en.wikipedia.org/wiki/Special:Search?go=Go&search='+encodeURIComponent(q)}
function linkRow(b){
  const L=(href,txt,tip)=>`<a class="lk" href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="${esc(tip)} (opens in a new tab)">${txt}<span aria-hidden="true"> ↗</span></a>`;
  return `<div class="links" aria-label="Learn more">
    <div class="lr"><span class="lkh">Book</span>${L(wiki(b.title+' '+b.author+' novel'),'Wikipedia','Search Wikipedia for this book')}${L('https://www.goodreads.com/search?q='+encodeURIComponent(b.title+' '+b.author),'Goodreads','Search Goodreads for this book')}</div>
    <div class="lr"><span class="lkh">Author</span>${L(wiki(b.author+' author'),'Wikipedia','Search Wikipedia for this author')}${L('https://www.isfdb.org/cgi-bin/se.cgi?type=Name&arg='+encodeURIComponent(b.author),'ISFDB','Search the Internet Speculative Fiction Database for this author')}</div>
  </div>`;
}
function card(b){
  const r=S.read.has(b.id);
  const hasWin=b.wins>0;
  const inLists=S.lists.filter(l=>l.books.includes(b.id)).length;
  return `<article class="card ${hasWin?'win':''} ${r?'is-read':''}" data-id="${esc(b.id)}">
    <h3>${esc(b.title)}</h3>
    <button class="author" data-act="author" data-v="${esc(b.author)}" title="Show all books by this author">${esc(b.author)}</button>
    <div class="badges">${b.entries.map(badge).join('')}</div>
    ${linkRow(b)}
    <div class="acts">
      <button class="btn sm ${r?'on':''}" data-act="read" aria-pressed="${r}">${r?'✓ Read':'Mark read'}</button>
      <button class="btn sm ghost" data-act="addlist">＋ List${inLists?' ('+inLists+')':''}</button>
    </div></article>`;
}
function decades(){const s=new Set();BOOKS.forEach(b=>b.entries.forEach(e=>s.add(Math.floor(e.year/10)*10)));return [...s].sort((a,b)=>b-a)}
function shellLibrary(){
  const app=$('#app');
  app.innerHTML=`
  <section class="panel filters" aria-label="Filters">
    <div class="row">
      <label class="f">Search<input type="text" id="q" placeholder="Title or author…" value="${esc(ui.q)}"></label>
      <label class="f">Show<select id="result"><option value="all">Winners &amp; finalists</option><option value="winner">Winners only</option></select></label>
      <label class="f">Status<select id="read"><option value="all">All books</option><option value="unread">Not read yet</option><option value="read">Already read</option></select></label>
      <label class="f">Decade<select id="decade"><option value="">All years</option>${decades().map(d=>`<option value="${d}">${d}s</option>`).join('')}</select></label>
      <label class="f">Group by<select id="group"><option value="none">No grouping</option><option value="year">Year</option><option value="decade">Decade</option><option value="award">Award</option><option value="author">Author</option></select></label>
      <label class="f">Sort<select id="sort"><option value="best">Most honoured</option><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="title">Title A–Z</option><option value="author">Author A–Z</option><option value="wins">Most wins</option></select></label>
    </div>
    <div><div class="f" style="margin-bottom:6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)">Award <span style="text-transform:none;letter-spacing:0">(none selected = all)</span></div>
      <div class="pills" id="awardPills">${AWARDS.map(a=>`<button class="pill" data-aw="${esc(a.key)}" style="--c:${a.color}" aria-pressed="false"><i></i>${esc(a.short)}</button>`).join('')}</div></div>
    <div class="row" id="authorRow"></div>
  </section>
  <div class="summary"><div id="count"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="surprise">🎲 Surprise me</button><button class="btn sm" data-act="addall">＋ Add all results to a list</button><button class="btn sm ghost" data-act="reset">Reset filters</button></div></div>
  <div id="results"></div>`;
  $('#result').value=ui.result;$('#read').value=ui.read;$('#decade').value=ui.decade;$('#group').value=ui.group;$('#sort').value=ui.sort;
  $('#q').addEventListener('input',e=>{ui.q=e.target.value;ui.limit=PAGE;renderResults()});
  for(const id of ['result','read','decade','group','sort'])$('#'+id).addEventListener('change',e=>{ui[id]=e.target.value;ui.limit=PAGE;renderResults()});
}
function renderResults(){
  if(ui.tab!=='library')return;
  document.querySelectorAll('#awardPills .pill').forEach(p=>{const on=ui.awards.has(p.dataset.aw);p.classList.toggle('on',on);p.setAttribute('aria-pressed',on)});
  $('#authorRow').innerHTML=ui.author?`<span class="chip">Author: <b>${esc(ui.author)}</b></span><button class="btn sm" data-act="clearauthor">✕ Clear author</button>`:'';
  const vis=visible();const gs=groups(vis);
  $('#count').innerHTML=`<b>${vis.length}</b> book${vis.length===1?'':'s'} match`;
  if(!vis.length){$('#results').innerHTML=`<div class="panel empty"><h3>No signals found</h3><p>Nothing matches these filters. Try widening them or hit “Reset filters”.</p></div>`;return}
  let shown=0,html='',more=false;
  for(const g of gs){
    if(shown>=ui.limit){more=true;break}
    const take=g.books.slice(0,ui.limit-shown);
    if(take.length<g.books.length)more=true;
    shown+=take.length;
    if(g.label)html+=`<div class="group"><h2>${esc(g.label)}</h2><span>${g.books.length} book${g.books.length===1?'':'s'}</span></div>`;
    html+=`<div class="grid">${take.map(card).join('')}</div>`;
  }
  if(more)html+=`<div class="more"><button class="btn" data-act="more">Show more (${shown} of ${ui.group==='none'?vis.length:'many'})</button></div>`;
  $('#results').innerHTML=html;
}
function renderLists(){
  const app=$('#app');
  if(!S.lists.length){ui.listId=null}
  else if(!S.lists.find(l=>l.id===ui.listId))ui.listId=S.lists[0].id;
  const cur=S.lists.find(l=>l.id===ui.listId);
  const side=`<aside class="panel lside" aria-label="Your lists">
    ${S.lists.map(l=>`<button class="litem ${l.id===ui.listId?'on':''}" data-act="pick" data-v="${l.id}"><span>${esc(l.name)}</span><small>${l.books.filter(id=>S.read.has(id)).length}/${l.books.length}</small></button>`).join('')||'<p style="margin:0;color:var(--muted);font-size:14px">No lists yet. Create your first reading list below.</p>'}
    <div class="newl"><input type="text" id="newListName" placeholder="New list name…" maxlength="60" aria-label="New list name"><button class="btn sm" data-act="newlist">Create</button></div>
  </aside>`;
  let main;
  if(!cur){main=`<section class="panel lmain empty"><h3>Mission board empty</h3><p>Create a list, then add books from the Library with the “＋ List” button.</p></section>`}
  else{
    const books=cur.books.map(id=>BYID.get(id)).filter(Boolean);
    const done=books.filter(b=>S.read.has(b.id)).length;
    main=`<section class="panel lmain">
      <div class="lhead"><input type="text" id="listName" value="${esc(cur.name)}" maxlength="60" aria-label="List name">
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="copylist">Copy as text</button><button class="btn sm warn" data-act="dellist">Delete list</button></div></div>
      <div style="display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px"><span><b style="color:var(--text)">${done}</b> of ${books.length} read</span><span class="bar" style="width:160px"><i style="width:${books.length?done/books.length*100:0}%"></i></span></div>
      ${books.length?`<div class="items">${books.map((b,i)=>`<div class="item ${S.read.has(b.id)?'is-read':''}" data-id="${esc(b.id)}">
        <div class="n">${i+1}</div><div><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)}</div><div class="badges" style="margin-top:4px">${b.entries.filter(e=>e.result==='winner').slice(0,4).map(badge).join('')}</div><div style="margin-top:6px">${linkRow(b)}</div></div>
        <div class="ib"><button class="btn sm ${S.read.has(b.id)?'on':''}" data-act="read" aria-pressed="${S.read.has(b.id)}">${S.read.has(b.id)?'✓ Read':'Mark read'}</button>
        <button class="btn sm ghost" data-act="up" aria-label="Move up">↑</button><button class="btn sm ghost" data-act="down" aria-label="Move down">↓</button><button class="btn sm ghost warn" data-act="rm" aria-label="Remove from list">✕</button></div></div>`).join('')}</div>`
      :`<div class="empty"><h3>This list is empty</h3><p>Go to the Library and use “＋ List” on any book, or “Add all results to a list”.</p><a class="btn" href="#library">Open Library</a></div>`}
    </section>`;
  }
  app.innerHTML=`<div class="lists">${side}${main}</div>`;
  const ln=$('#listName');
  if(ln)ln.addEventListener('change',()=>{const v=ln.value.trim();if(v&&cur.name!==v){cur.name=v;touch();renderAll()}else ln.value=cur.name});
  const nl=$('#newListName');
  nl.addEventListener('keydown',e=>{if(e.key==='Enter')$('[data-act=newlist]').click()});
}
function renderAbout(){
  const counts=AWARDS.map(a=>{const w=BOOKS.reduce((n,b)=>n+b.entries.filter(e=>e.award===a.key&&e.result==='winner').length,0);const t=BOOKS.reduce((n,b)=>n+b.entries.filter(e=>e.award===a.key).length,0);return `<li><b style="color:${a.color}">${esc(a.short)}</b> — ${esc(a.key)}: ${w} winners, ${t-w} finalists recorded</li>`}).join('');
  $('#app').innerHTML=`<section class="panel about">
    <h2>What’s in here</h2>
    <p>${BOOKS.length} distinct novels across seven science-fiction awards. Category covered: <b>Best Novel</b> only (the closest equivalent for each award).</p>
    <ul>${counts}</ul>
    <h2>Known gaps &amp; quirks</h2>
    <ul>
      <li><b>Locus</b>: winners for 1980–2026 only; the full finalist list is included for 2026 only. Locus awards before 1980 are not included.</li>
      <li><b>Campbell Memorial</b>: the award was cancelled in 2020 and 2021 and has not resumed, so data ends at 2019. It had no winner in 1976 and 1994 (finalists only).</li>
      <li><b>Years</b> follow the source lists: Hugo, Clarke, Campbell, Locus and Philip K. Dick use the year of the ceremony; Nebula and (recently) BSFA list the eligibility year, so the ceremony is usually the following year.</li>
      <li><b>Philip K. Dick</b> is for original paperbacks and sometimes honours collections or anthologies, which are listed as given. Special citations are omitted.</li>
      <li>Some early years have no finalists on record (Hugo 1953, 1955, 1958; several BSFA years). Ties and joint winners are each marked as winners.</li>
      <li>Data was compiled from Wikipedia award lists and the Science Fiction Awards Database (sfadb.com) in November 2026. It was transcribed automatically, so a few errors are possible — please sanity-check anything important.</li>
    </ul>
    <h2>Install on your phone</h2>
    <p>In Chrome on Android, open the menu (⋮) and choose <b>Install app</b> or <b>Add to Home screen</b>. It then opens full screen like a normal app and starts even without a connection.</p>
    <h2>Your data</h2>
    <p>“Read” marks and reading lists are saved in your own Firebase project (Cloud Firestore) once you sign in with Google, and sync across your devices. Only the account allowed by your Firestore security rules can read or write them. Without signing in, they are kept in this browser only (the indicator at the top shows which).</p>
  </section>`;
}

/* ---------- overlay ---------- */
function openOv(html){const r=$('#ovRoot');r.innerHTML=`<div class="ov" data-act="ovclose"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;const f=r.querySelector('input,button');if(f)f.focus()}
function closeOv(){$('#ovRoot').innerHTML=''}
function listPicker(ids,title,sub){
  const rows=S.lists.map(l=>{
    const all=ids.every(id=>l.books.includes(id));
    return `<button class="mrow ${all?'on':''}" data-act="${ids.length>1?'bulk':'toggle'}" data-v="${l.id}"><span class="ck">${all?'✓':''}</span><span style="flex:1">${esc(l.name)}</span><small style="color:var(--muted)">${l.books.length}</small></button>`}).join('');
  openOv(`<h3>${esc(title)}</h3><p>${esc(sub)}</p>${rows||'<p>You have no lists yet — create one:</p>'}
    <div class="newl"><input type="text" id="ovNew" placeholder="New list name…" maxlength="60" aria-label="New list name"><button class="btn sm" data-act="ovnew">Create &amp; add</button></div>
    <div style="margin-top:14px;text-align:right"><button class="btn sm ghost" data-act="ovclose2">Done</button></div>`);
  $('#ovNew').addEventListener('keydown',e=>{if(e.key==='Enter')$('[data-act=ovnew]').click()});
}
let pickIds=[];

/* ---------- actions ---------- */
function renderAll(){
  $('#hudRead').textContent=S.read.size;$('#hudTotal').textContent=BOOKS.length;
  $('#hudBar').style.width=(BOOKS.length?S.read.size/BOOKS.length*100:0)+'%';
  $('#listCount').textContent=S.lists.length?'('+S.lists.length+')':'';
  document.querySelectorAll('nav.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.tab===ui.tab));
  if(ui.tab==='library'){if(!$('#results'))shellLibrary();renderResults()}
  else if(ui.tab==='lists')renderLists();
  else renderAbout();
}
function route(){
  const h=(location.hash||'#library').slice(1);
  const t=['library','lists','about'].includes(h)?h:'library';
  if(t!==ui.tab||!$('#app').children.length){ui.tab=t;$('#app').innerHTML='';}
  renderAll();
}
function toggleRead(id){S.read.has(id)?S.read.delete(id):S.read.add(id);touch()}
function newList(name,ids){
  name=name.trim();if(!name)return null;
  const l={id:uid(),name,created:Date.now(),books:[...new Set(ids||[])]};S.lists.push(l);touch();return l;
}
document.addEventListener('click',ev=>{
  const aw=ev.target.closest('[data-aw]');
  if(aw){const k=aw.dataset.aw;ui.awards.has(k)?ui.awards.delete(k):ui.awards.add(k);ui.limit=PAGE;renderResults();return}
  const t=ev.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,v=t.dataset.v;
  const host=t.closest('[data-id]');const id=host&&host.dataset.id;
  const cur=S.lists.find(l=>l.id===ui.listId);
  if(act==='ovclose'){if(ev.target===t)closeOv();return}
  if(act==='ovclose2'){closeOv();renderAll();return}
  if(act==='read'){toggleRead(id);renderAll();return}
  if(act==='author'){ui.author=v;ui.limit=PAGE;if(ui.tab!=='library'){location.hash='#library'}else renderResults();window.scrollTo({top:0,behavior:'smooth'});return}
  if(act==='clearauthor'){ui.author='';renderResults();return}
  if(act==='more'){ui.limit+=PAGE;renderResults();return}
  if(act==='reset'){Object.assign(ui,{q:'',result:'all',read:'all',decade:'',sort:'best',group:'none',limit:PAGE,author:''});ui.awards.clear();$('#app').innerHTML='';renderAll();return}
  if(act==='addlist'){pickIds=[id];const b=BYID.get(id);listPicker(pickIds,'Add to reading list',b.title+' — '+b.author);return}
  if(act==='addall'){const ids=visible().map(b=>b.id);if(!ids.length){toast('No books to add');return}pickIds=ids;listPicker(ids,'Add all results to a list',ids.length+' books currently shown by your filters');return}
  if(act==='toggle'){const l=S.lists.find(x=>x.id===v);const i=l.books.indexOf(pickIds[0]);i<0?l.books.push(pickIds[0]):l.books.splice(i,1);touch();listPicker(pickIds,'Add to reading list',BYID.get(pickIds[0]).title+' — '+BYID.get(pickIds[0]).author);return}
  if(act==='bulk'){const l=S.lists.find(x=>x.id===v);let n=0;for(const x of pickIds)if(!l.books.includes(x)){l.books.push(x);n++}touch();toast(n+' added to “'+l.name+'”');closeOv();renderAll();return}
  if(act==='ovnew'){const l=newList($('#ovNew').value,pickIds.length>1?pickIds:[]);if(!l){$('#ovNew').focus();return}
    if(pickIds.length===1){l.books.push(pickIds[0]);touch()}toast('Added to “'+l.name+'”');closeOv();renderAll();return}
  if(act==='surprise'){const pool=visible().filter(b=>!S.read.has(b.id));if(!pool.length){toast('Nothing unread matches — widen your filters');return}
    const b=pool[Math.floor(Math.random()*pool.length)];
    openOv(`<h3>Your next transmission</h3><p>A random unread pick from your current filters.</p><div class="grid" style="grid-template-columns:1fr">${card(b)}</div><div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="btn sm" data-act="surprise">Another</button><button class="btn sm ghost" data-act="ovclose2">Close</button></div>`);return}
  if(act==='pick'){ui.listId=v;renderLists();return}
  if(act==='newlist'){const el=$('#newListName');const l=newList(el.value,[]);if(!l){el.focus();return}ui.listId=l.id;renderAll();return}
  if(act==='dellist'){if(t.dataset.sure){S.lists=S.lists.filter(l=>l.id!==ui.listId);touch();renderAll();toast('List deleted')}else{t.dataset.sure='1';t.textContent='Click again to confirm';setTimeout(()=>{if(t.isConnected){delete t.dataset.sure;t.textContent='Delete list'}},3000)}return}
  if(act==='copylist'&&cur){const txt=cur.name+'\n'+cur.books.map(i=>BYID.get(i)).filter(Boolean).map((b,i)=>(i+1)+'. '+b.title+' — '+b.author+(S.read.has(b.id)?' [read]':'')).join('\n');
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('List copied'),()=>{openOv('<h3>Copy list</h3><p>Select and copy the text below.</p><textarea readonly style="width:100%;height:220px;background:#070c1c;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit">'+esc(txt)+'</textarea><div style="margin-top:12px;text-align:right"><button class="btn sm" data-act="ovclose2">Close</button></div>')});return}
  if(cur&&(act==='up'||act==='down'||act==='rm')&&id){const i=cur.books.indexOf(id);if(i<0)return;
    if(act==='rm')cur.books.splice(i,1);
    else{const j=act==='up'?i-1:i+1;if(j<0||j>=cur.books.length)return;[cur.books[i],cur.books[j]]=[cur.books[j],cur.books[i]]}
    touch();renderAll();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOv()});
window.addEventListener('hashchange',route);

/* ---------- boot ---------- */
(async function(){
  try{
    const r=await fetch('data.json');if(!r.ok)throw new Error(r.status);
    prep(await r.json());
  }catch(e){
    $('#app').innerHTML='<div class="panel empty"><h3>Archive offline</h3><p>Could not load the award data. Please reload the page.</p></div>';return;
  }
  setSync('loading');$('#authBtn').addEventListener('click',authClick);route();connect();
  window.addEventListener('online',()=>{if(ref&&dirty)flush();else if(fb&&!ref&&fb.auth.currentUser)onUser(fb.auth.currentUser)});
  window.addEventListener('offline',()=>{if(ref)setSync('offline')});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
