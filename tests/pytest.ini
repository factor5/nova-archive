[pytest]
testpaths = .
addopts = -p no:cacheprovider -q
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
markers =
    f01: feature file number (f01..f12), run one area with -m f09
    smoke: fast, essential scenarios
    regression: everything else
    mobile: phone viewport
    desktop: desktop viewport
    firebase-mock: needs Firebase test double
    ol-mock: needs Open Library test double
    sw: needs the service worker
    wip: scenario that cannot be automated yet; skipped
    manual: cannot be automated
